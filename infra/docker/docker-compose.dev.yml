version: '3.8'

services:
  db:
    image: postgres:15
    container_name: rfp_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rfp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: rfp_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: